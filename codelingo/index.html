<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F4EF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodeLingo">
  <meta name="format-detection" content="telephone=no">
  <title>CodeLingo</title>
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen" class="screen"></main>
  <nav id="tabbar" class="tabbar"></nav>

  <section id="lesson" class="lesson" hidden>
    <div class="ltop">
      <button class="x" data-act="quit" aria-label="Close">
        <svg class="pix" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="2" height="1"/><rect x="6" y="0" width="2" height="1"/><rect x="0" y="1" width="3" height="1"/><rect x="5" y="1" width="3" height="1"/><rect x="1" y="2" width="6" height="1"/><rect x="2" y="3" width="4" height="2"/><rect x="1" y="5" width="6" height="1"/><rect x="0" y="6" width="3" height="1"/><rect x="5" y="6" width="3" height="1"/><rect x="0" y="7" width="2" height="1"/><rect x="6" y="7" width="2" height="1"/></svg>
      </button>
      <div id="bar" class="bar"><i></i></div>
      <button id="lmascot" class="mascot-btn" data-act="mascot" aria-label="Hint"></button>
    </div>
    <div id="lessonBody" class="lbody"></div>
    <div id="sheet" class="sheet" hidden></div>
    <div class="lfoot"><button id="checkBtn" class="btn" data-act="check" disabled>Check</button></div>
    <div id="kbd" class="kbd" role="group" aria-label="Keyboard" hidden></div>
    <div id="edlive" class="sr-only" aria-live="polite"></div>
  </section>

  <div id="glow" class="glow"></div>
  <div id="bigicon" class="bigicon"></div>
  <div id="bubble" class="bubble" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="courses/_core.js"></script>
  <script src="courses/html.js"></script>
  <script src="courses/css.js"></script>
  <script src="courses/js.js"></script>
  <script src="courses/ts.js"></script>
  <script src="courses/py.js"></script>
  <script src="courses/sql.js"></script>
  <script src="music.js"></script>
  <script src="app.js"></script>
</body>
</html>
